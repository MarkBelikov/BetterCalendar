name: Windows app release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Determine release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable semantic version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --json id 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Build Windows installer and update metadata
        if: steps.version.outputs.exists == 'false'
        run: npm run dist -- --publish never
      - name: Publish the new version
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $installer = "dist/BetterCalendar-Setup-$env:RELEASE_VERSION.exe"
          if (!(Test-Path $installer) -or !(Test-Path 'dist/latest.yml')) { throw 'Release files missing.' }
          gh release create "v$env:RELEASE_VERSION" $installer "$installer.blockmap" 'dist/latest.yml' --target $env:RELEASE_COMMIT --title "Better Calendar $env:RELEASE_VERSION" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
